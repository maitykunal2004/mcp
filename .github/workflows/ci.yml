name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: python -m pip install -r requirements.txt
      - name: Syntax check (compile)
        run: python -m compileall .
      - name: Smoke import test
        run: python -c "import streamlit_app; print('import-ok')"
